{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailgate-operator.fullname" . }}-ui
  labels:
    {{- include "tailgate-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "tailgate-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "tailgate-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ include "tailgate-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "tailgate-operator.ui.image" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TAILGATE_UI_ADDR
              value: ":8080"
            - name: TAILGATE_UI_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.oauthSecretName | default (printf "%s-ui-oauth" (include "tailgate-operator.fullname" .)) }}
                  key: client_id
            - name: TAILGATE_UI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.oauthSecretName | default (printf "%s-ui-oauth" (include "tailgate-operator.fullname" .)) }}
                  key: client_secret
            - name: TAILGATE_UI_OAUTH_REDIRECT_URL
              value: {{ .Values.ui.oauthRedirectURL | quote }}
            - name: TAILGATE_UI_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.oauthSecretName | default (printf "%s-ui-oauth" (include "tailgate-operator.fullname" .)) }}
                  key: session_key
                  optional: true
            - name: TAILGATE_UI_ADMIN_EMAILS
              value: {{ .Values.ui.adminEmails | join "," | quote }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
{{- end -}}
