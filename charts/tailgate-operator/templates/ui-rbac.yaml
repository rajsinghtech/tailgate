{{- if and .Values.ui.enabled .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tailgate-operator.clusterRoleName" . }}-ui
  labels:
    {{- include "tailgate-operator.labels" . | nindent 4 }}
rules:
# EgressGroup CRs: the UI reads all, creates with owner annotation, deletes (owner-gated in-app).
- apiGroups:
  - tailscale.rajsingh.info
  resources:
  - egressgroups
  - egressgroups/status
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Pods: the UI counts member pods for the detail view.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tailgate-operator.clusterRoleName" . }}-ui
  labels:
    {{- include "tailgate-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tailgate-operator.clusterRoleName" . }}-ui
subjects:
- kind: ServiceAccount
  name: {{ include "tailgate-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end -}}
