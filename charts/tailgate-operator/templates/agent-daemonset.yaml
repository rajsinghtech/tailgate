{{- if .Values.agent.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tailgate-operator.agentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailgate-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "tailgate-operator.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tailgate-operator.agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tailgate-operator.serviceAccountName" . }}
      # The agent veth-stitches member pods into the gateway netns and scans /proc,
      # so it needs the host network/PID namespaces and a privileged container.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
      - name: agent
        image: {{ include "tailgate-operator.agent.image" . }}
        imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TAILGATE_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        # In-cluster ranges kept on the primary CNI for exit-node members so kube-dns /
        # the API server never blackhole through the full tunnel.
        - name: TAILGATE_CLUSTER_CIDRS
          value: {{ .Values.agent.clusterCIDRs | quote }}
        volumeMounts:
        # The agent writes CNI credentials here (server/token/ca.crt) for the
        # tailgate-cni plugin to query membership at CNI ADD time, AND reads the
        # per-node gateway <group>.routes for MirrorRoutes.
        - name: run
          mountPath: /run/tailgate
        {{- with .Values.agent.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: run
        hostPath:
          path: /run/tailgate
          type: DirectoryOrCreate
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
