# Default values for tailgate-operator
# This is a YAML-formatted file.

# -- Number of operator replicas (typically 1; the operator does not currently
# run leader election, so keep this at 1).
replicaCount: 1

operator:
  image:
    # -- Operator container image repository
    repository: ghcr.io/rajsinghtech/tailgate-operator
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Overrides the image tag (default is the chart appVersion)
    tag: ""
  # Resource requests and limits for the operator
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  # -- Pod annotations for the operator Deployment
  podAnnotations: {}
  # -- Pod labels for the operator Deployment
  podLabels: {}
  # -- Node selector for operator pods
  nodeSelector: {}
  # -- Tolerations for operator pods
  tolerations: []
  # -- Affinity rules for operator pods
  affinity: {}

# Per-node agent DaemonSet. The agent veth-stitches member pods into the gateway
# netns, so it must run privileged with hostPID + hostNetwork on every node.
agent:
  # -- Deploy the per-node agent DaemonSet
  enabled: true
  # -- Agent DaemonSet name. Defaults to "tailgate-agent" (a sibling of the operator, not
  # named after it). Set to override.
  nameOverride: ""
  image:
    # -- Agent container image repository (bundles tailgate-cni)
    repository: ghcr.io/rajsinghtech/tailgate-agent
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Overrides the image tag (default is the chart appVersion)
    tag: ""
  # -- In-cluster pod + service CIDRs to keep on the primary CNI — never steered onto the
  # tailnet. Guards cluster networking two ways: a member on an exit node (full tunnel) keeps
  # reaching kube-dns / the API server instead of blackholing through the tunnel, and any
  # accepted/mirrored tailnet route that overlaps a cluster range is dropped before it would
  # capture pod/service traffic. Carve BOTH the pod and service CIDRs (e.g.
  # "10.244.0.0/16,10.96.0.0/12"). Comma-separated.
  clusterCIDRs: "10.96.0.0/12"
  # -- tailgate-cni install mode. "disabled" = do not install; "binary" = copy
  # tailgate-cni to /opt/cni/bin for Multus NetworkAttachmentDefinitions; "chained" =
  # mutate the primary CNI conflist (do NOT use with Multus+Cilium delegate conflists).
  cniMode: disabled
  # Resource requests and limits for the agent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  # -- Pod annotations for the agent DaemonSet
  podAnnotations: {}
  # -- Pod labels for the agent DaemonSet
  podLabels: {}
  # -- Node selector for agent pods
  nodeSelector: {}
  # -- Tolerations for agent pods. Defaults to running everywhere (Exists).
  tolerations:
    - operator: Exists

# Per-group gateway DaemonSet image. The operator stamps this image into the
# gateway workloads it creates for each EgressGroup; it is not run by the chart.
gateway:
  image:
    # -- Gateway container image repository
    repository: ghcr.io/rajsinghtech/tailgate-gateway
    # -- Overrides the gateway image tag (default is the chart appVersion)
    tag: ""

# Management web UI. Authenticates users via Tailscale OAuth (identity-only)
# and reads/writes EgressGroup CRs. Users see their own groups; admins see all.
# Requires a separate Tailscale OAuth app (create under Settings → OAuth apps,
# no scopes needed — identity only). The redirect URL must match
# TAILGATE_UI_OAUTH_REDIRECT_URL exactly.
ui:
  # -- Deploy the management UI
  enabled: false
  image:
    # -- UI container image repository
    repository: ghcr.io/rajsinghtech/tailgate-ui
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Overrides the image tag (default is the chart appVersion)
    tag: ""
  # -- Number of UI replicas (stateless; scale freely)
  replicaCount: 2
  # -- OAuth app credentials. Create a Secret with keys client_id, client_secret,
  # and optionally session_key. Set oauthSecretName to reference an existing Secret,
  # or use the values below to create one.
  oauthSecretName: ""
  oauthClientID: ""
  oauthClientSecret: ""
  oauthRedirectURL: ""
  # -- Session key for signing cookies (32+ bytes hex). If empty, a random one
  # is generated per pod restart (sessions don't survive restarts). Set for production.
  sessionKey: ""
  # -- Comma-separated list of admin emails who can see and manage all groups.
  adminEmails: []
  service:
    # -- Service type for the UI
    type: ClusterIP
  # Resource requests and limits for the UI
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

# DNS mutating webhook. When an EgressGroup sets dns.enabled, member pods it selects get
# native tailnet DNS (resolver = the gateway's 100.100.100.100, cluster.local kept on
# CoreDNS). The operator self-signs the serving cert (no cert-manager dependency).
webhook:
  # -- Deploy the DNS mutating webhook (Service + MutatingWebhookConfiguration).
  enabled: true

# Tailnet credentials. The operator mints ephemeral authkeys via the Tailscale
# OAuth API for the gateways it provisions.
tailnet:
  # -- Create the tailnet credentials Secret from the values below. Set to false to
  # reference an existing Secret instead.
  create: true
  # -- Name of the Secret holding the tailnet OAuth credentials.
  secretName: tailgate-tailnet-creds
  # -- Tailnet name (e.g. "example.com"). Stored under key TS_TAILNET.
  tailnet: ""
  # -- OAuth client ID. Stored under key TS_OAUTH_CLIENT_ID.
  oauthClientID: ""
  # -- OAuth client secret. Stored under key TS_OAUTH_CLIENT_SECRET.
  oauthClientSecret: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount (shared by the operator and the agent)
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- ServiceAccount name (generated if not set and create is true)
  name: ""

# Pod security context for the operator
podSecurityContext:
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Seccomp profile type
  seccompProfile:
    type: RuntimeDefault

# Container security context for the operator
securityContext:
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - "ALL"

# -- Priority class name for operator and agent pods
priorityClassName: ""

# -- Termination grace period in seconds for the operator
terminationGracePeriodSeconds: 10

# CRD installation
crds:
  # -- Install CRDs with Helm
  install: true
  # -- Keep CRDs on chart uninstall
  keep: true
  # -- Annotations for CRDs
  annotations: {}

# RBAC configuration
rbac:
  # -- Create RBAC resources (ClusterRole + ClusterRoleBinding)
  create: true

# -- Extra Kubernetes objects to deploy with the chart (supports templating)
extraObjects: []
