name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This module uses a local `replace tailscale.com => ...` and is built outside any
# go.work, so force GOWORK=off for every go invocation in CI.
env:
  GOWORK: off

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      # The internal/netfilter tests program real nftables rules in a fresh network
      # namespace, so they need root (CAP_NET_ADMIN). This is the CI gate that exercises
      # the native nft datapath on the runner's nf_tables kernel — the path the gateway
      # uses on Talos+Cilium where legacy iptables is unavailable.
      - name: Run datapath tests (root — needs netns + nftables)
        run: |
          sudo env "PATH=$PATH" "GOWORK=off" \
            "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            go test ./internal/netfilter/... -v
